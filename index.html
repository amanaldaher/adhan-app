<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azan App</title>
    <style>
      :root {
        --bg1: #e9f0ea;          /* أخضر حليبي ناعم */
        --bg2: #d6e4d8;          /* أخضر حشيشي باهت */
        --card: rgba(255, 255, 255, 0.92);
        --primary: #436a4e;       /* أخضر غابي راقي */
        --primary-hover: #34533d;
        --accent: #7fa682;        /* سيج ناعم */
        --accent-light: #eaf2eb;
        --text: #1d2e22;
        --muted: #6b8271;
        --border: #d2ded4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--text);
        
        background-color: #e3ebe4;
        background-image: 
          radial-gradient(at 15% 15%, rgba(127, 166, 130, 0.35) 0px, transparent 55%),
          radial-gradient(at 85% 85%, rgba(67, 106, 78, 0.25) 0px, transparent 60%),
          radial-gradient(at 50% 50%, rgba(214, 228, 216, 0.5) 0px, transparent 100%);
        background-attachment: fixed;
        position: relative;
        overflow-x: hidden;
      }
      .container {
        background: var(--card);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 22px;
        border-radius: 20px;
        width: 360px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 15px 35px rgba(45, 75, 52, 0.12);
      }
      h2 {
        margin: 0 0 12px;
        text-align: center;
        color: var(--primary);
      }
      .inputs {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
      }
      input {
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        outline: none;
        font-size: 14px;
        color: var(--text);
        background: #fafdfa;
      }
      input:focus {
        border-color: var(--accent);
      }

      .hijri-preview {
        font-size: 12px;
        padding: 6px 10px;
        background: var(--accent-light);
        border: 1px dashed var(--accent);
        border-radius: 8px;
        color: var(--primary);
        font-weight: bold;
        text-align: center;
        min-height: 16px;
        transition: all 0.2s;
      }

      button {
        padding: 10px 14px;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: var(--primary-hover);
      }

      .next-prayer-banner {
        margin-top: 12px;
        padding: 12px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: white;
        text-align: center;
        box-shadow: 0 4px 12px rgba(67, 106, 78, 0.2);
      }
      .next-prayer-banner .label {
        font-size: 12px;
        opacity: 0.92;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .next-prayer-banner .time-info {
        font-size: 20px;
        font-weight: bold;
        margin-top: 4px;
      }

      .header {
        margin-top: 10px;
        padding: 10px;
        border-radius: 10px;
        background: #f4f8f4;
        border: 1px solid var(--border);
        text-align: center;
      }
      .header .location {
        font-weight: bold;
        font-size: 14px;
        color: var(--primary);
      }
      .header .dates {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        justify-content: space-around;
        align-items: center;
      }
      .header .hijri {
        font-weight: bold;
        color: var(--primary);
      }

      .grid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .card {
        padding: 10px;
        border-radius: 12px;
        background: linear-gradient(135deg, #ffffff, #f4f7f4);
        border: 1px solid var(--border);
        text-align: center;
        transition: all 0.2s;
      }
      .card.active {
        border: 2px solid var(--primary);
        background: var(--accent-light);
        transform: scale(1.02);
      }
      .name {
        font-size: 12px;
        color: var(--muted);
      }
      .time {
        font-size: 16px;
        font-weight: bold;
        margin-top: 4px;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Prayer Times</h2>
      <div class="inputs">
        <input type="text" id="date" placeholder="DD-MM-YYYY" />
        <div id="hijri-badge" class="hijri-preview">🌙 جاري الحساب...</div>
        
        <input type="text" id="city" placeholder="City" value="Homs" />
        <input type="text" id="country" placeholder="Country code (e.g. SY)" value="SY" />
        <button onclick="fetchApi()">Get Times</button>
      </div>
      <div id="result"></div>
    </div>

    <script>
      const API_URL = "https://api.aladhan.com/v1";

      // 1. تحويل التاريخ الميلادي لهجري تلقائياً
      const updateHijriDate = async (dateStr) => {
        const hijriBadge = document.getElementById("hijri-badge");
        if (!dateStr || dateStr.length < 8) return;

        hijriBadge.innerText = "🌙 جاري التحويل...";

        try {
          const res = await fetch(`${API_URL}/gToH/${dateStr}`);
          const data = await res.json();

          if (data.data && data.data.hijri) {
            const h = data.data.hijri;
            hijriBadge.innerText = `🌙 الموافق: ${h.day} ${h.month.ar} ${h.year} هـ`;
          }
        } catch (e) {
          hijriBadge.innerText = "🌙 تعذر حساب الهجري";
        }
      };

      // 2. تعبئة تاريخ اليوم تلقائياً
      const setTodayDate = () => {
        const today = new Date();
        const d = String(today.getDate()).padStart(2, "0");
        const m = String(today.getMonth() + 1).padStart(2, "0");
        const y = today.getFullYear();
        const fullDate = `${d}-${m}-${y}`;
        document.getElementById("date").value = fullDate;
        
        updateHijriDate(fullDate);
      };
      setTodayDate();

      // 3. مراقبة التغيير على حقل التاريخ
      document.getElementById("date").addEventListener("change", (e) => {
        updateHijriDate(e.target.value.trim());
      });

      // 4. الدالة الرئيسية لجلب المواقيت وحساب الصلاة القادمة تلقائياً بدقة
      const fetchApi = async () => {
        const date = document.getElementById("date").value.trim();
        const city = document.getElementById("city").value.trim() || "Homs";
        const country = document.getElementById("country").value.trim() || "SY";
        const resultDiv = document.getElementById("result");

        resultDiv.innerHTML = "<p style='text-align:center;'>جاري جلب البيانات...</p>";

        try {
          const cityEndpoint = `/timingsByCity/${date}?city=${city}&country=${country}`;
          const resCity = await fetch(API_URL + cityEndpoint);
          const dataCity = await resCity.json();
          
          if (!dataCity.data) {
            throw new Error("بيانات غير متوفرة");
          }

          const timings = dataCity.data.timings;
          const hijriData = dataCity.data.date.hijri;
          const hijriFormatted = `${hijriData.day} ${hijriData.month.ar} ${hijriData.year} هـ`;
          document.getElementById("hijri-badge").innerText = `🌙 الموافق: ${hijriFormatted}`;

          // الصلوات الأساسية بالترتيب الزمني
          const prayers = [
            { key: "Fajr", name: "الفجر" },
            { key: "Dhuhr", name: "الظهر" },
            { key: "Asr", name: "العصر" },
            { key: "Maghrib", name: "المغرب" },
            { key: "Isha", name: "العشاء" }
          ];

          // تحويل وقت النص (HH:MM) إلى دقائق
          const timeToMinutes = (timeStr) => {
            const clean = timeStr.split(" ")[0]; // التخلص من الرموز الزائدة مثل (EEST)
            const [h, m] = clean.split(":").map(Number);
            return h * 60 + m;
          };

          const now = new Date();
          const currentMinutes = now.getHours() * 60 + now.getMinutes();

          let nextPrayer = null;

          // البحث عن أول صلاة وقتها بعد الوقت الحالي
          for (let p of prayers) {
            if (timings[p.key]) {
              const prayerMinutes = timeToMinutes(timings[p.key]);
              if (prayerMinutes > currentMinutes) {
                nextPrayer = {
                  key: p.key,
                  name: p.name,
                  time: timings[p.key].split(" ")[0]
                };
                break;
              }
            }
          }

          // إذا خلصت صلوات اليوم كلها (بعد العشاء)، بتصير الصلاة القادمة فجر الغد
          if (!nextPrayer) {
            nextPrayer = {
              key: "Fajr",
              name: "الفجر (غداً)",
              time: timings["Fajr"].split(" ")[0]
            };
          }

          let html = `
            <div class="next-prayer-banner">
              <div class="label">الصلاة القادمة (Next Prayer) ⏳</div>
              <div class="time-info">${nextPrayer.name} - ${nextPrayer.time}</div>
            </div>

            <div class="header">
              <div class="location">${city.toUpperCase()}, ${country.toUpperCase()}</div>
              <div class="dates">
                <span>${date}</span>
                <span>•</span>
                <span class="hijri">🌙 ${hijriFormatted}</span>
              </div>
            </div>

            <div class="grid">
          `;

          for (let p of prayers) {
            const isNext = p.key === nextPrayer.key ? "active" : "";
            const displayTime = timings[p.key] ? timings[p.key].split(" ")[0] : "--:--";
            html += `
              <div class="card ${isNext}">
                <div class="name">${p.name} (${p.key}) ${isNext ? "★" : ""}</div>
                <div class="time">${displayTime}</div>
              </div>
            `;
          }

          html += `</div>`;
          resultDiv.innerHTML = html;

        } catch (e) {
          console.error("Error fetching data:", e);
          resultDiv.innerHTML = "<p style='color:red; text-align:center;'>صار خطأ بالاتصال بالسيرفر! تأكدي من الاتصال بالإنترنت 🛑</p>";
        }
      };

      fetchApi();
    </script>
  </body>
</html>
